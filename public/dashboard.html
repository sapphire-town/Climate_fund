<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climate Change Crowdfunding</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <nav>
    <div class="nav-container">
      <h1>CLIMATE CROWD FUNDING</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#about_div">About</a></li>
        <li><a href="#contact">Contact Us</a></li>
        <li><a href="contribute.html">Contribute</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </nav>
  <div class="container">
    <header>
      <h1>🌍 Climate Change Crowdfunding</h1>
      <button id="initiateActivity" class="btn-primary">Initiate Activity</button>
    </header>


    <!-- Search and Sort -->
    <div class="controls">
      <input type="text" id="searchBar" placeholder="Search activities...">
      <select id="sortOptions">
        <option value="latest">Latest Activities</option>
        <option value="closest">Closest to Completion</option>
      </select>
    </div>

    <!-- Ongoing Activities -->
    <div id="activitiesList" class="activities-grid"></div>

    <!-- Initiate Activity Modal -->
    <div id="activityModal" class="modal">
      <div class="modal-content card">
        <span class="close">&times;</span>
        <h2>Initiate Activity</h2>
        <form id="activityForm">
          <label for="activityName">Activity Name:</label>
          <input type="text" id="activityName" placeholder="Enter activity name" required>

          <label for="activityDescription">Description:</label>
          <textarea id="activityDescription" placeholder="Describe the activity" required></textarea>

          <label for="activityImage">Image URL:</label>
          <input type="text" id="activityImage" placeholder="Enter image URL" required>

          <label for="activityDeadline">Deadline:</label>
          <input type="datetime-local" id="activityDeadline" required>

          <button type="submit" class="btn-primary">Create Activity</button>
        </form>
      </div>
    </div>

    <!-- Donation Modal -->
    <div id="donationModal" class="modal">
      <div class="modal-content card">
        <span class="close">&times;</span>
        <h2>Contribute</h2>
        <img src="https://via.placeholder.com/200x200" alt="UPI QR Code" class="qr-code">
        <form id="transactionForm">
          <label for="transactionId">Transaction ID:</label>
          <input type="text" id="transactionId" placeholder="Enter UPI Transaction ID" required>

          <label for="amount">Amount (₹):</label>
          <input type="number" id="amount" placeholder="Enter amount" required>

          <button type="submit" class="btn-primary">Submit Transaction</button>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
