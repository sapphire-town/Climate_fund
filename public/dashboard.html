<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation Bar -->
  <nav>
    <div class="nav-container">
      <h1>CLIMATE CROWD FUNDING</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#about_div">About</a></li>
        <li><a href="#contact">Contact Us</a></li>
        <li><a href="contribute.html">Contribute</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <h1>Your Activities</h1>
    <div id="activitiesList" class="activities-grid"></div>
    <button id="initiateActivity" class="btn-primary">Initiate Activity</button>
  </div>

  <!-- Initiate Activity Modal -->
  <div id="activityModal" class="modal">
    <div class="modal-content card">
      <span class="close">&times;</span>
      <h2>Initiate Activity</h2>
      <form id="activityForm">
        <label for="activityName">Activity Name:</label>
        <input type="text" id="activityName" placeholder="Enter activity name" required>

        <label for="activityDescription">Description:</label>
        <textarea id="activityDescription" placeholder="Describe the activity" required></textarea>

        <label for="activityImage">Image URL:</label>
        <input type="text" id="activityImage" placeholder="Enter image URL" required>

        <label for="activityTarget">Target Amount (₹):</label>
        <input type="number" id="activityTarget" placeholder="Enter target amount" required>

        <label for="activityDeadline">Deadline:</label>
        <input type="datetime-local" id="activityDeadline" required>

        <button type="submit" class="btn-primary">Create Activity</button>
      </form>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
